# ~/.config/rig/boxes.conf, the roster rig and crew share. Fictional hosts.
# It names machines, so keep it in private config, never in a public repo.
# `rig boxes --lint` checks it for addresses outside mounts=.

box=@defaults
repos=~/config ~/notes ~/dotfiles ~/src/sc-fleet/main
# What `rig push` may commit. Leave public repos out, so an automatic
# `sync: <box>` commit never writes a host name into their history.
push=~/config ~/notes ~/dotfiles
timers=notes-sync config-pull
sched=auto
own=yes
profile=work
# A box without rig yet is bootstrapped from this checkout and script.
bootstrap_repo=~/src/sc-fleet/main
bootstrap=install.sh

box=atlas
ssh=atlas
role=dev
mounts=/data
note=the dev machine; local disk is not durable

box=borealis
ssh=borealis
role=prod
own=no
note=read-only to rig: probed, never written

box=lab-printer
role=worker
note=registry-only: no ssh alias, never contacted
